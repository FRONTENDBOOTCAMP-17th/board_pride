<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>게시글 상세보기</title>
  </head>
  <body>
    <h2 id="title">불러오는 중...</h2>
    <div id="info"></div>
    <hr />
    <div id="content"></div>
    <br />
    <a href="./03_fetch_post-05list.html?id=">목록으로</a>

    <script>
      const params = new URLSearchParams(window.location.search);
      const postId = params.get("id");
      console.log(postId);

      const token = localStorage.getItem("token");

      const title = document.getElementById("title");
      const info = document.getElementById("info");
      const content = document.getElementById("content");

      async function loadPost() {
        if (!postId) {
          title.textContent = "잘못된 접근입니다.";
          return;
        }

        try {
          const res = await fetch(
            `https://api.fullstackfamily.com/api/edu/ws-481f1b/posts/${postId}`,
            {
              method: "GET",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + token,
              },
            },
          );

          if (!res.ok) {
            throw new Error("HTTP 오류: " + res.status);
          }

          const detailData = await res.json();
          const details = detailData.data;

          title.textContent = details.title;

          info.textContent =
            details.authorNickname +
            " | 조회 " +
            details.viewCount +
            " | 댓글 " +
            details.commentCount;

          content.textContent = details.content;
        } catch (error) {
          title.textContent = "에러 발생";
          content.textContent = error.message;
          content.style.color = "red";
        }
      }

      loadPost();
    </script>
  </body>
</html>
