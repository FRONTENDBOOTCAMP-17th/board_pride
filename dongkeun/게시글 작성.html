<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>게시판</title>
    <style>
      fieldset {
        width: 400px;
        position: relative;
      }

      textarea {
        width: 200px;
        height: 200px;
      }

      #submitBtn {
        border-radius: 8px;
        position: absolute;
        inset: 0 0 auto auto;
        translate: -10% 20%;
        background: rgb(93, 138, 243);
        color: #fff;
        border-color: currentColor;
      }

      #title {
        width: 100%;
      }

      #content {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <h2>게시판</h2>
    <fieldset>
      <legend>게시판 작성</legend>
      <p>제목:</p>
      <input type="text" id="title" placeholder="제목을 입력하세요." />
      <br />
      <p>내용:</p>
      <textarea
        type="text"
        id="content"
        placeholder="본문을 작성하세요."
      ></textarea>
      <br />
      <button id="submitBtn" type="button">글쓰기</button>
    </fieldset>
    <pre id="result"></pre>

    <script>
      document
        .getElementById("submitBtn")
        .addEventListener("click", async () => {
          const username = document.getElementById("username");
          const nickname = document.getElementById("nickname");
          const token = localStorage.getItem("token");

          const title = document.getElementById("title").value;
          const content = document.getElementById("content").value;

          try {
            // draft 생성
            const res = await fetch(
              "https://api.fullstackfamily.com/api/edu/ws-481f1b/posts",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  Authorization: "Bearer " + token,
                },
                body: JSON.stringify({ title, content }),
              },
            );

            if (!res.ok) {
              throw new Error("HTTP 오류: " + res.status);
            }

            const data = await res.json();
            const postId = data.data.id;
            nickname.textContent = "글쓴이: " + data.data.authorNickname;

            // publish
            const publishRes = await fetch(
              `https://api.fullstackfamily.com/api/edu/ws-481f1b/posts/${postId}/publish`,
              {
                method: "PUT",
                headers: {
                  "Content-Type": "application/json",
                  Authorization: "Bearer " + token,
                },
                body: JSON.stringify({ title, content }),
              },
            );

            if (!publishRes.ok) {
              throw new Error("HTTP 오류: " + res.status);
            }

            const publishData = await publishRes.json();
            result.textContent = JSON.stringify(publishData.data, null, 2);
            result.style.color = "green";
            location.href = "03_fetch_post-list.html";
          } catch (error) {
            result.textContent = "에러 발생: " + error.message;
            result.style.color = "red";
          }
        });
    </script>
  </body>
</html>
