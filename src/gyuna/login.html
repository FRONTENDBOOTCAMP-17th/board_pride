<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>로그인</title>
  </head>
  <body>
    <h2>로그인</h2>

    <input id="username" placeholder="아이디" />
    <br /><br />
    <input id="password" type="password" placeholder="비밀번호" />
    <br /><br />
    <button id="loginBtn">로그인</button>

    <pre id="result"></pre>

    <script>
      document
        .getElementById("loginBtn")
        .addEventListener("click", async () => {
          const result = document.getElementById("result");

          const username = document.getElementById("username").value;
          const password = document.getElementById("password").value;

          if (!username || !password) {
            result.style.color = "red";
            result.textContent = "아이디와 비밀번호를 입력하세요.";
            return;
          }

          try {
            result.textContent = "로그인 중...";

            const res = await fetch(
              "https://api.fullstackfamily.com/api/edu/ws-8fd532/auth/login",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({ username, password }),
              },
            );

            if (!res.ok) {
              throw new Error("로그인 실패");
            }

            const data = await res.json();
            console.log("로그인 응답:", data);

            // 🔥 token 저장
            const token = data.data?.token || data.token;
            localStorage.setItem("token", token);

            // 🔥 user 안전하게 처리
            const user = data.user || data.data?.user;

            if (user) {
              const { id, username, nickname } = user;

              result.style.color = "green";
              result.textContent =
                "로그인 성공!\n\n" +
                "ID: " +
                id +
                "\n" +
                "Username: " +
                username +
                "\n" +
                "Nickname: " +
                nickname;
            } else {
              // 🔥 user 없을 경우
              result.style.color = "green";
              result.textContent = "로그인 성공! (사용자 정보 없음)";
            }

            // 이동
            setTimeout(() => {
              window.location.href = "list.html";
            }, 2500);
          } catch (error) {
            console.error(error);
            result.style.color = "red";
            result.textContent = "로그인 실패";
          }
        });
    </script>
  </body>
</html>
