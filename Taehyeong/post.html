<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>게시판 글 작성 완료</title>
  </head>
  <body>
    <h2>게시판 글 작성</h2>
    <p id="username">사용자 확인 중...</p>

    <input type="text" id="title" placeholder="제목을 입력하세요." />
    <br /><br />
    <textarea id="content" placeholder="내용을 입력하세요."></textarea>
    <br /><br />
    <button id="postBtn">완료</button>

    <pre id="result"></pre>

    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const username = document.getElementById("username");
        const result = document.getElementById("result");
        const accessToken = localStorage.getItem("token");

        if (!accessToken) {
          alert("로그인이 필요합니다.");
          location.replace("./login.html");
          return;
        }

        try {
          const res = await fetch(
            "https://api.fullstackfamily.com/api/edu/ws-9e2114/auth/me",
            {
              method: "GET",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + accessToken,
              },
            },
          );
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || "사용자 정보 로드 실패");
          username.textContent = `작성자 : ${data.data.nickname}`;
        } catch (error) {
          console.error("인증 에러:", error);
          location.replace("./login.html");
          return;
        }

        const postBtn = document.getElementById("postBtn");
        postBtn.addEventListener("click", async () => {
          const title = document.getElementById("title").value;
          const content = document.getElementById("content").value;

          if (!title || !content) {
            result.textContent = "제목 혹은 내용을 입력해주세요.";
            result.style.color = "red";
            return;
          }

          try {
            result.textContent = "저장 중...";

            const draft = await fetch(
              "https://api.fullstackfamily.com/api/edu/ws-9e2114/posts",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  Authorization: "Bearer " + accessToken,
                },
                body: JSON.stringify({ title, content }),
              },
            );

            const draftData = await draft.json();
            if (!draft.ok)
              throw new Error(draftData.message || "초안 저장 실패");

            const postId = draftData.data.id;
            result.textContent = "초안 저장 성공! 발행 중...";

            const publishRes = await fetch(
              `https://api.fullstackfamily.com/api/edu/ws-9e2114/posts/${postId}/publish`,
              {
                method: "PUT",
                headers: {
                  "Content-Type": "application/json",
                  Authorization: "Bearer " + accessToken,
                },
                body: JSON.stringify({ title, content }),
              },
            );

            const publishData = await publishRes.json();
            if (!publishRes.ok)
              throw new Error(publishData.message || "발행 실패");

            result.textContent = "게시글 발행이 완료되었습니다!";
          } catch (error) {
            result.textContent = "에러: " + error.message;
          }
        });
      });
    </script>
  </body>
</html>
