<!-- 9.2.4 POST 요청 예제 -->
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Fetch POST 요청</title>
  </head>
  <body>
    <h2>회원가입</h2>
    <input type="text" id="username" placeholder="username" />
    <input type="password" id="password" placeholder="password" />
    <input type="text" id="nickname" placeholder="nickname" />
    <button id="submitBtn">생성</button>
    <pre id="result"></pre>

    <script>
      document.getElementById('submitBtn').addEventListener('click', async () => {
        const result = document.getElementById('result');

        const signupData = {
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
          nickname: document.getElementById('nickname').value,
        };

        //   const usernameRegex = /^[a-zA-Z0-9]{4,20}$/; // 영문/숫자 4~20자
        //   const passwordRegex = /^.{4,20}$/; // 모든 문자 4~20자
        //   const nicknameRegex = /^[가-힣a-zA-Z0-9]{2,20}$/; // 한글/영문/숫자 2~20자

        //   if (!usernameRegex.test(username)) {
        //     alert("아이디는 4~20자의 영문/숫자이어야 한다.");
        //     return;
        //   }
        //   if (!passwordRegex.test(password)) {
        //     alert("비밀번호는 4~20자여야 한다.");
        //     return;
        //   }
        //   if (!nicknameRegex.test(nickname)) {
        //     alert("닉네임은 한글/영문/숫자 포함 2~20자여야 한다");
        //     return;
        //   }

        try {
          result.textContent = '전송 중...';

          const res = await fetch('https://api.fullstackfamily.com/api/edu/ws-9e2114/auth/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(signupData),
          });

          if (!res.ok) {
            throw new Error('HTTP 오류: ' + res.status);
          }

          const data = await res.json();
          result.textContent = '생성 성공\nID: ' + data.id + '\n\n' + JSON.stringify(data, null, 2);
          result.style.color = 'green';
        } catch (error) {
          result.textContent = '에러: ' + error.message;
          result.style.color = 'red';
        }
      });
    </script>
  </body>
</html>
