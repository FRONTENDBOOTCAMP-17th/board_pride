<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>게시글 상세</title>
  </head>
  <body>
    <h2 id="title">불러오는 중...</h2>
    <div id="info"></div>
    <hr />
    <div id="content"></div>
    <br />
    <a href="list.html">목록으로 돌아가기</a>

    <script>
      // 파라미터읽어온다. ?id=100
      const params = new URLSearchParams(window.location.search);
      const postId = params.get("id"); // postId는 100의 값을 가진다.

      const titleEl = document.getElementById("title");
      const infoEl = document.getElementById("info");
      const contentEl = document.getElementById("content");

      async function loadPost() {
        // postId 가 없거나 잘못된 값이면 오류처리 - 잘못된 경로입니다.
        if (!postId) {
          titleEl.textContent = "잘못된 접근입니다.";
          return;
        }

        try {
          // https://api.fullstackfamily.com/api/edu/ws-283fc1/posts/{id}
          const res = await fetch(
            "https://api.fullstackfamily.com/api/edu/ws-9e2114/posts/" + postId,
          );

          if (!res.ok) {
            throw new Error("HTTP 오류: " + res.status);
          }

          const jsonObj = await res.json();
          const post = jsonObj.data;

          titleEl.textContent = post.title;
          infoEl.textContent =
            post.authorNickname +
            " | 조회 " +
            post.viewCount +
            " | 댓글 " +
            post.commentCount;
          contentEl.textContent = post.content;
        } catch (error) {
          titleEl.textContent = "에러 발생";
          contentEl.textContent = error.message;
        }
      }

      loadPost(); // async 함수 호출
    </script>
  </body>
</html>
