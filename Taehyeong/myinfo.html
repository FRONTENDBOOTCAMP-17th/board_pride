<!-- 9.2.4 POST 요청 예제 -->
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Fetch POST 요청</title>
  </head>
  <body>
    <h2>내 정보 확인</h2>
    <button id="infoBtn">내 정보 확인</button>
    <pre id="result"></pre>

    <script>
      document.getElementById("infoBtn").addEventListener("click", async () => {
        const result = document.getElementById("result");

        try {
          result.textContent = "전송 중...";

          const savedToken = localStorage.getItem("token");

          const res = await fetch(
            "https://api.fullstackfamily.com/api/edu/ws-9e2114/auth/me",
            {
              method: "GET",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + savedToken,
              },
            },
          );

          if (!res.ok) {
            throw new Error("HTTP 오류: " + res.status);
          }

          const data = await res.json();
          result.textContent =
            "내 정보 확인\n\n" +
            "username :" +
            data.data.username +
            "\n\n" +
            "nickname :" +
            data.data.nickname;

          result.style.color = "green";
        } catch (error) {
          result.textContent = "에러: " + error.message;
          result.style.color = "red";
        }
      });
    </script>
  </body>
</html>
