<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>게시글 목록</title>
  </head>
  <style>
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      border: 1px solid #777;
      margin: 10px;
      padding: 10px;
      border-radius: 8px;

      a {
        text-decoration: none;
        color: #333;
        font-weight: bold;
      }
    }
  </style>
  <body>
    <h2>게시글 목록</h2>

    <ul id="post-list"></ul>
    <p id="message">불러오는 중...</p>

    <script>
      const postList = document.getElementById("post-list");
      const message = document.getElementById("message");

      async function loadPosts() {
        try {
          const res = await fetch(
            "https://api.fullstackfamily.com/api/edu/ws-9e2114/posts",
          );
          console.log(res);
          // res.data.contet =>>> 게시물들의 배열

          if (!res.ok) {
            throw new Error("HTTP 오류: " + res.status);
          }

          const resJson = await res.json();
          const posts = resJson.data.content;

          if (posts.length === 0) {
            message.textContent = "게시글이 없습니다.";
            return;
          }

          message.textContent = "";

          for (let i = 0; i < posts.length; i++) {
            const post = posts[i];

            const li = document.createElement("li"); // <li></li>

            const link = document.createElement("a"); // <a></a>
            link.href = "detail.html?id=" + post.id; // <a href="detail.html?id=180"></a>
            link.textContent = post.title; // <a href="detail.html?id=180">제목</a>

            const info = document.createElement("div"); // <div></div>
            info.textContent =
              post.authorNickname +
              " | 조회 " +
              post.viewCount +
              " | 댓글 " +
              post.commentCount; // <div>이름 | 조회 숫자 | 댓글 숫자</div>

            const preview = document.createElement("div"); // <div></div>
            preview.textContent = post.contentPreview; // <div>프리뷰</div>

            li.appendChild(link); // <li><a href="detail.html?id=180">제목</a></li>
            li.appendChild(info); // <li><a href="detail.html?id=180">제목</a>div>이름 | 조회 숫자 | 댓글 숫자</div></li>
            li.appendChild(preview); // <li><a href="detail.html?id=180">제목</a>div>이름 | 조회 숫자 | 댓글 숫자</div><div>프리뷰</div></li>
            postList.appendChild(li); // <ul id="post-list"><li...>...</li></ul>
          }
        } catch (error) {
          message.style.color = "red";
          message.textContent = "에러 발생: " + error.message;
        }
      }

      loadPosts();
    </script>
  </body>
</html>
