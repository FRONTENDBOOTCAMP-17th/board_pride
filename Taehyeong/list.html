<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>게시글 목록</title>
    <style>
      body {
        font-family: 'Pretendard', sans-serif;
        background-color: #f8f9fa;
        color: #333;
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      h2 {
        text-align: center;
        margin-bottom: 30px;
        color: #2c3e50;
      }

      #post-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      #post-list li {
        background: #ffffff;
        margin-bottom: 16px;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      #post-list li:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      }

      .post-content {
        flex-grow: 1;
        padding-right: 20px;
      }

      .post-title {
        font-size: 1.25rem;
        font-weight: bold;
        text-decoration: none;
        color: #1a73e8;
        display: block;
        margin-bottom: 8px;
      }

      .post-title:hover {
        text-decoration: underline;
      }

      .post-info {
        font-size: 0.85rem;
        color: #6c757d;
        margin-bottom: 12px;
      }

      .post-preview {
        font-size: 0.95rem;
        color: #495057;
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .post-actions {
        display: flex;
        gap: 8px;
        flex-shrink: 0;
      }

      button {
        padding: 8px 14px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 500;
        transition: background-color 0.2s;
      }

      .btn-edit {
        background-color: #f1f3f4;
        color: #3c4043;
      }

      .btn-edit:hover {
        background-color: #e8eaed;
      }

      .btn-delete {
        background-color: #ffe3e3;
        color: #c92a2a;
      }

      .btn-delete:hover {
        background-color: #ffc9c9;
      }

      #message {
        text-align: center;
        font-size: 1.1rem;
        color: #666;
      }
    </style>
  </head>
  <body>
    <h2>게시글 목록</h2>

    <ul id="post-list"></ul>
    <p id="message">불러오는 중...</p>

    <script>
      const postList = document.getElementById('post-list');
      const message = document.getElementById('message');

      async function loadPosts() {
        try {
          const res = await fetch('https://api.fullstackfamily.com/api/edu/pride-d1c90b/posts');

          if (!res.ok) {
            throw new Error('HTTP 오류: ' + res.status);
          }

          const resJson = await res.json();
          const posts = resJson.data.content;

          if (posts.length === 0) {
            message.textContent = '게시글이 없습니다.';
            return;
          }

          message.style.display = 'none';

          for (let i = 0; i < posts.length; i++) {
            const post = posts[i];

            const li = document.createElement('li');

            const contentDiv = document.createElement('div');
            contentDiv.className = 'post-content';

            const link = document.createElement('a');
            link.href = 'detail.html?id=' + post.id;
            link.textContent = post.title;
            link.className = 'post-title';

            const info = document.createElement('div');
            info.className = 'post-info';
            info.textContent = `${post.authorNickname} | 조회 ${post.viewCount} | 댓글 ${post.commentCount}`;

            const preview = document.createElement('div');
            preview.className = 'post-preview';
            preview.textContent = post.contentPreview;

            contentDiv.appendChild(link);
            contentDiv.appendChild(info);
            contentDiv.appendChild(preview);

            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'post-actions';

            const editBtn = document.createElement('button');
            editBtn.textContent = '수정';
            editBtn.className = 'btn-edit';
            editBtn.onclick = () => {
              window.location.href = `post.html?id=${post.id}`;
            };

            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = '삭제';
            deleteBtn.className = 'btn-delete';
            deleteBtn.onclick = async () => {
              const isConfirmed = confirm('정말 이 게시글을 삭제하시겠습니까?');

              if (isConfirmed) {
                try {
                  const token = localStorage.getItem('token');

                  const deleteRes = await fetch(`https://api.fullstackfamily.com/api/edu/pride-d1c90b/posts/${post.id}`, {
                    method: 'DELETE',
                    headers: {
                      'Content-Type': 'application/json',
                      Authorization: `Bearer ${token}`,
                    },
                  });

                  if (deleteRes.ok) {
                    alert('삭제가 완료되었습니다.');
                    li.remove();
                  } else {
                    alert('삭제에 실패했습니다. (상태 코드: ' + deleteRes.status + ')');
                  }
                } catch (error) {
                  alert('네트워크 오류가 발생했습니다: ' + error.message);
                }
              }
            };

            actionsDiv.appendChild(editBtn);
            actionsDiv.appendChild(deleteBtn);

            li.appendChild(contentDiv);
            li.appendChild(actionsDiv);
            postList.appendChild(li);
          }
        } catch (error) {
          message.style.display = 'block';
          message.style.color = 'red';
          message.textContent = '에러 발생: ' + error.message;
        }
      }

      loadPosts();
    </script>
  </body>
</html>
