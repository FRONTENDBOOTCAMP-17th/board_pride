<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>글 수정</title>
    <link rel="stylesheet" href="./게시글수정.css" />
  </head>
  <body>
    <fieldset>
      <legend>사용자 정보</legend>
      <p id="userId"></p>
      <p id="nickname"></p>
    </fieldset>

    <fieldset>
      <legend>글 수정</legend>
      <label for="title">제목</label>
      <input id="title" type="text" />
      <br />

      <label for="content">본문</label>
      <textarea name="content" id="content"></textarea>
      <br />

      <button id="postCreateButton" type="button">수정완료</button>
    </fieldset>

    <script>
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");

      const titleInput = document.getElementById("title");
      const contentInput = document.getElementById("content");
      const postUsername = document.getElementById("userId");
      const postNickname = document.getElementById("nickname");
      const postCreateButton = document.getElementById("postCreateButton");

      init();

      async function init() {
        await handlerApi();
        await loadPost();
      }

      async function handlerApi() {
        const accessToken = localStorage.getItem("token");

        try {
          const res = await fetch(
            "https://api.fullstackfamily.com/api/edu/test-c68e57/auth/me",
            {
              method: "GET",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + accessToken,
              },
            },
          );

          const { message, success, data } = await res.json();

          if (!res.ok) {
            throw new Error(
              "HTTP 오류: " +
                res.status +
                "\n\nsuccess: " +
                success +
                "\n\nmessage: " +
                message,
            );
          }

          const { nickname, username } = data;
          postUsername.textContent = username;
          postNickname.textContent = nickname;
        } catch (error) {
          console.error("에러:", error.message);
        }
      }

      async function loadPost() {
        const accessToken = localStorage.getItem("token");

        try {
          const res = await fetch(
            `https://api.fullstackfamily.com/api/edu/test-c68e57/posts/${id}`,
            {
              method: "GET",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + accessToken,
              },
            },
          );

          if (!res.ok) {
            throw new Error("게시글을 불러오지 못했습니다.");
          }

          const data = await res.json();
          const postData = data.data;

          titleInput.value = postData.title;
          contentInput.value = postData.content;
        } catch (error) {
          console.error("에러:", error.message);
        }
      }

      postCreateButton.addEventListener("click", async () => {
        const accessToken = localStorage.getItem("token");

        const post = {
          title: titleInput.value,
          content: contentInput.value,
        };

        try {
          const res = await fetch(
            `https://api.fullstackfamily.com/api/edu/test-c68e57/posts/${id}`,
            {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + accessToken,
              },
              body: JSON.stringify(post),
            },
          );

          if (!res.ok) {
            throw new Error("게시글 수정에 실패했습니다.");
          }

          location.replace("./게시판목록.html");
        } catch (error) {
          console.error("에러:", error.message);
        }
      });
    </script>
  </body>
</html>
