<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>게시판</title>
    <link rel="stylesheet" href="./게시판목록.css" />
  </head>
  <body>
    <fieldset>
      <button id="postCreate">글쓰기</button>
      <legend>게시판</legend>
      <ul id="postList"></ul>
    </fieldset>
    <script>
      const create = document.getElementById("postCreate");
      create.addEventListener("click", () => {
        location.href = "./글쓰기.html";
      });

      loadPostsList();

      async function loadPostsList() {
        const postList = document.getElementById("postList");

        try {
          const res = await fetch(
            "https://api.fullstackfamily.com/api/edu/test-c68e57/posts",
            {
              method: "GET",
            },
          );

          if (!res.ok) {
            throw new Error("게시글 목록을 불러오지 못했습니다.");
          }

          const data = await res.json();
          console.log(data);

          postList.innerHTML = "";

          const posts = data.data.content;
          posts.forEach((post) => {
            const item = document.createElement("a");
            item.href = `./게시물상세정보.html?id=${post.id}`;
            item.style.display = "block";
            item.style.marginBottom = "16px";

            const [date, time] = post.createdAt.split("T");

            item.innerHTML = `
                <li>
                    <p class="title">${post.title}</p>
                    <p class="preview">${post.contentPreview}</p>
                    <div class="meta">
                        <p>${post.authorNickname}</p>
                        <p>조회수: ${post.viewCount}</p>
                        <p>댓글: ${post.commentCount}</p>
                    </div>
                    <time class="date">${date} | ${time}</time>
                </li>
            `;

            postList.appendChild(item);
          });
        } catch (error) {
          console.error(error);
          postList.innerHTML =
            "<p>게시글을 불러오는 중 오류가 발생했습니다.<p>";
        }
      }
    </script>
  </body>
</html>
