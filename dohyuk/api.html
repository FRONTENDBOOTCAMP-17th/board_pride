<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Fetch POST 요청</title>
  </head>
  <body>
    <h2>로그인</h2>
    <input type="text" id="username" placeholder="유저네임" />
    <input type="password" id="password" placeholder="비밀번호" />
    <button id="submitBtn">로그인하기</button>
    <pre id="result"></pre>

    <script>
      async function apiFetch(url, options = {}) {
        const token = localStorage.getItem("token");

        const res = await fetch(url, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
            ...options.headers,
          },
        });

        return res;
      }

      document
        .getElementById("submitBtn")
        .addEventListener("click", async () => {
          const result = document.getElementById("result");

          const loginData = {
            username: document.getElementById("username").value,
            password: document.getElementById("password").value,
          };

          try {
            result.textContent = "로그인 요청 중...";

            const loginRes = await fetch(
              "https://api.fullstackfamily.com/api/edu/test-c68e57/auth/login",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify(loginData),
              }
            );

            if (!loginRes.ok) {
              throw new Error("로그인 HTTP 오류: " + loginRes.status);
            }

            const loginResult = await loginRes.json();

            const token = loginResult.data.token;
            localStorage.setItem("token", token);

            const meRes = await apiFetch(
              "https://api.fullstackfamily.com/api/edu/test-c68e57/auth/me",
              {
                method: "GET",
              }
            );

            if (!meRes.ok) {
              throw new Error("내 정보 조회 HTTP 오류: " + meRes.status);
            }

            const meData = await meRes.json();

            result.textContent =
              "로그인 성공\n" +
              "토큰 저장 완료\n\n" +
              "[내 정보 조회 결과]\n" +
              JSON.stringify(meData, null, 2);

            result.style.color = "green";
          } catch (error) {
            result.textContent = "에러: " + error.message;
            result.style.color = "red";
          }
        });
    </script>
  </body>
</html>
