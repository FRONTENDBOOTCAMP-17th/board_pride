<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>게시글 삭제</title>
    <link rel="stylesheet" href="./게시물상세정보.css" />
    <style>
      body {
        font-family: 'Pretendard', sans-serif;
        background-color: #f5f6f8;
        margin: 0;
        min-height: 100vh;
        padding: 40px 20px;
        box-sizing: border-box;
        color: #333;
      }

      fieldset {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        padding: 40px;
        border: none;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }

      legend {
        padding: 0 8px;
        font-size: 26px;
        font-weight: bold;
        color: #333;
      }

      .contents {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      #title {
        margin: 0 0 8px;
        font-size: 30px;
        font-weight: 700;
        color: #222;
        line-height: 1.3;
        word-break: keep-all;
      }

      #createdAt,
      #author,
      #viewCount {
        font-size: 14px;
        color: #666;
        margin: 0;
      }

      #content {
        margin: 12px 0 0;
        font-size: 16px;
        line-height: 1.7;
        color: #444;
        white-space: pre-wrap;
        word-break: break-word;
      }

      #postActions {
        max-width: 800px;
        margin: 20px auto 0;
        display: none;
        justify-content: flex-end;
        gap: 10px;
      }

      #postActions button {
        padding: 12px 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        transition: background 0.2s;
      }

      #deleteButton {
        background-color: #f1f3f5;
        color: #333;
      }

      #deleteButton:hover {
        background-color: #e9ecef;
      }

      #correctionButton {
        background-color: #222;
        color: white;
      }

      #correctionButton:hover {
        background-color: #444;
      }

      @media (max-width: 640px) {
        body {
          padding: 24px 16px;
        }

        fieldset {
          padding: 24px;
        }

        #title {
          font-size: 24px;
        }

        #postActions {
          flex-direction: column;
        }

        #postActions button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <fieldset>
      <legend>게시물</legend>
      <div class="contents">
        <h1 id="title"></h1>
        <time id="createdAt" datetime=""></time>
        <p id="author"></p>
        <p id="viewCount"></p>
        <p id="content"></p>
      </div>
    </fieldset>
    <div id="postActions">
      <button id="deleteButton">삭제</button>
      <button id="correctionButton">수정</button>
    </div>
    <script>
      const url = new URLSearchParams(window.location.search);
      const id = url.get('id');
      const API_URL = 'https://api.fullstackfamily.com/api/edu/pride-d1c90b';

      if (id) {
        loadPost();
      }

      async function loadPost() {
        const postActions = document.getElementById('postActions');

        const token = localStorage.getItem('token');
        const post = {
          title: document.getElementById('title'),
          content: document.getElementById('content'),
          author: document.getElementById('author'),
          createDate: document.getElementById('createdAt'),
          viewCount: document.getElementById('viewCount'),
        };
        try {
          const res = await fetch(`${API_URL}/posts/${id}`, {
            method: 'GET',
          });
          if (!res.ok) {
            throw new Error('게시글을 불러오지 못했습니다.');
          }

          const data = await res.json();
          const postData = data.data;

          const [date, time] = postData.createdAt.split('T');

          post.title.textContent = postData.title;
          post.content.textContent = postData.content;
          post.author.textContent = postData.authorNickname;
          post.createDate.setAttribute('datetime', postData.createdAt);
          post.createDate.textContent = `${date} | ${time}`;
          post.viewCount.textContent = postData.viewCount;

          document.title = postData.title;

          if (token) {
            const me = await fetch(`${API_URL}/auth/me`, {
              method: 'GET',
              headers: {
                Authorization: `Bearer ${token}`,
              },
            });

            if (me.ok) {
              const meData = await me.json();

              if (meData.data.nickname === postData.authorNickname) {
                postActions.style.display = 'flex';
              }
            }
          }
        } catch (error) {
          console.error(error);
          alert('게시글을 불러오는 데 실패했습니다.');
          location.replace('./게시판목록.html');
        }
        deletePost();
        correctionPost();
      }
      function deletePost() {
        const deleteBtn = document.getElementById('deleteButton');
        if (!deleteBtn) {
          return;
        }

        deleteBtn.addEventListener('click', async () => {
          const token = localStorage.getItem('token');

          const isReal = confirm('정말 삭제 하시겠습니까?');

          if (!isReal) {
            return;
          }

          try {
            const deleteApi = await fetch(`${API_URL}/posts/${id}`, {
              method: 'DELETE',
              headers: {
                Authorization: `Bearer ${token}`,
              },
            });

            if (!deleteApi.ok) {
              throw new Error('게시글 삭제에 실패했습니다.');
            }

            alert('게시글이 삭제되었습니다.');
            location.replace('./게시판목록.html');
          } catch (error) {
            console.error(error);
          }
        });
      }

      function correctionPost() {
        const correctionBtn = document.getElementById('correctionButton');
        if (!correctionBtn) {
          return;
        }

        correctionBtn.addEventListener('click', async () => {
          location.href = `./게시글수정.html?id=${id}`;
        });
      }
    </script>
  </body>
</html>
