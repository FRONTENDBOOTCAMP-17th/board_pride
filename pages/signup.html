<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>회원가입</title>
    <style>
      body {
        font-family: 'Pretendard', sans-serif;
        background-color: #f5f6f8;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
      }

      fieldset {
        background: white;
        border: none;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        width: 350px;
        padding: 40px;
        display: flex;
        flex-flow: nowrap column;
        gap: 12px;
        justify-content: center;
        text-align: center;
        box-sizing: border-box;
      }

      legend {
        font-size: 26px;
        font-weight: bold;
        color: #333;
        padding: 0 8px;
        margin-bottom: 20px;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 14px;
      }

      input:focus {
        outline: none;
        border-color: #999;
      }

      button {
        width: 100%;
        padding: 12px;
        background-color: #222;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        transition: background 0.2s;
        margin-top: 4px;
      }

      button:hover {
        background-color: #444;
      }

      #result {
        margin-top: 15px;
        min-height: 30px;
        font-size: 14px;
        font-weight: 700;
        text-align: center;
        white-space: pre-wrap;
      }

      .error {
        display: block;
        color: red;
        font-size: 12px;
        text-align: left;
        margin-top: -6px;
        margin-bottom: 2px;
        min-height: 16px;
      }

      pre {
        font-family: 'Pretendard', sans-serif;
      }
    </style>
  </head>
  <body>
    <fieldset>
      <legend>회원가입</legend>
      <input type="text" id="username" placeholder="아이디 (영문, 숫자 4~12자)" />
      <span class="error" id="usernameError"></span>
      <input type="password" id="password" placeholder="비밀번호 (영문, 숫자, 특수문자 8자 이상)" />
      <span class="error" id="passwordError"></span>
      <input type="text" id="nickname" placeholder="닉네임 (한글만 가능)" />
      <span class="error" id="nicknameError"></span>
      <button id="submitBtn">회원가입</button>
    </fieldset>

    <pre id="result"></pre>

    <script>
      const rules = {
        username: /^[A-Za-z0-9]{4,12}$/,
        password: /^(?=.*[A-Za-z])(?=.*\d)(?=.*[!@#$%^&*])[A-Za-z\d!@#$%^&*]{8,}$/,
        nickname: /^[가-힣]+$/,
      };

      const messages = {
        username: '아이디는 영문, 숫자 4~12자여야 합니다.',
        password: '비밀번호는 영문, 숫자, 특수문자를 포함한 8자 이상이어야 합니다.',
        nickname: '닉네임은 한글만 입력 가능합니다.',
      };

      function validate() {
        let isValid = true;

        for (const field in rules) {
          const value = document.getElementById(field).value.trim();
          const errorEl = document.getElementById(field + 'Error');

          if (!rules[field].test(value)) {
            errorEl.textContent = messages[field];
            isValid = false;
          } else {
            errorEl.textContent = '';
          }
        }

        return isValid;
      }

      document.getElementById('submitBtn').addEventListener('click', async () => {
        const result = document.getElementById('result');

        if (!validate()) return;

        const signupData = {
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
          nickname: document.getElementById('nickname').value,
        };

        try {
          result.textContent = '전송 중...';

          const res = await fetch('https://api.fullstackfamily.com/api/edu/pride-d1c90b/auth/signup', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(signupData),
          });

          if (!res.ok) {
            throw new Error('HTTP 오류: ' + res.status);
          }

          const data = await res.json();
          result.textContent = '회원가입 성공!\n' + '\nusername: ' + data.data.username + '\nnickname: ' + data.data.nickname;
          result.style.color = 'green';
          location.replace('./login.html');
        } catch (error) {
          result.textContent = '에러 발생: ' + error.message;
          result.style.color = 'red';
        }
      });
    </script>
  </body>
</html>
