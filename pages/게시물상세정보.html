<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>게시글 삭제</title>
    <link rel="stylesheet" href="./게시물상세정보.css" />
    <script type="module" src="./comments/main.js"></script>
  </head>
  <body>
    <fieldset>
      <legend>게시물</legend>
      <div class="contents">
        <h1 id="title"></h1>
        <time id="createdAt" datetime=""></time>
        <div id="meta">
          <p id="author"></p>
          <p id="viewCount"></p>
        </div>
        <p id="content"></p>
      </div>
    </fieldset>
    <div id="postActions">
      <button id="deleteButton">삭제</button>
      <button id="correctionButton">수정</button>
    </div>
    <div id="comment-components">
      <!-- 댓글 대충여기에 적힘 -->
    </div>
    <label for="comment-create">댓글</label>
    <input type="text" name="" id="comment-create" />
    <button id="comment-success" type="submit">완료</button>
    
    <script>
      const url = new URLSearchParams(window.location.search);
      const id = url.get('id');
      const API_URL = 'https://api.fullstackfamily.com/api/edu/pride-d1c90b';

      if (id) {
        loadPost();
      }

      async function loadPost() {
        const postActions = document.getElementById('postActions');

        const token = localStorage.getItem('token');
        console.log(token);
        const post = {
          title: document.getElementById('title'),
          content: document.getElementById('content'),
          author: document.getElementById('author'),
          createDate: document.getElementById('createdAt'),
          viewCount: document.getElementById('viewCount'),
        };
        try {
          const res = await fetch(`${API_URL}/posts/${id}`, {
            method: 'GET',
          });
          if (!res.ok) {
            throw new Error('게시글을 불러오지 못했습니다.');
          }

          const data = await res.json();
          const postData = data.data;

          const [date, time] = postData.createdAt.split('T');

          post.title.textContent = postData.title;
          post.content.textContent = postData.content;
          post.author.textContent = postData.authorNickname;
          post.createDate.setAttribute('datetime', postData.createdAt);
          post.createDate.textContent = `${date} | ${time}`;
          post.viewCount.textContent = postData.viewCount;

          document.title = postData.title;

          if (token) {
            const me = await fetch(`${API_URL}/auth/me`, {
              method: 'GET',
              headers: {
                Authorization: `Bearer ${token}`,
              },
            });

            if (me.ok) {
              const meData = await me.json();

              if (meData.data.nickname === postData.authorNickname) {
                postActions.style.display = 'flex';
              }
            }
          }
        } catch (error) {
          console.error(error);
          alert('게시글을 불러오는 데 실패했습니다.');
          location.replace('./게시판목록.html');
        }
        deletePost();
        correctionPost();
        createComment();
      }

      function createComment() {
        const commentInput = document.getElementById('comment-create');
        const commentBtn = document.getElementById('comment-success');

        commentBtn.addEventListener('click', async () => {
          const content = commentInput.value.trim();

          if (!content) {
            alert('댓글 내용을 입력해주세요.');
            return;
          }

          const token = localStorage.getItem('token');

          try {
            const res = await fetch(`${API_URL}/posts/${id}/comments`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({ content }),
            });

            if (!res.ok) {
              throw new Error('댓글 작성에 실패했습니다.');
            }

            const data = await res.json();
            console.log('댓글 작성 성공:', data);

            commentInput.value = '';
          } catch (error) {
            console.error('댓글 작성 오류:', error);
          }
        });
      }

      function deletePost() {
        const deleteBtn = document.getElementById('deleteButton');
        if (!deleteBtn) {
          return;
        }

        deleteBtn.addEventListener('click', async () => {
          const token = localStorage.getItem('token');

          const isReal = confirm('정말 삭제 하시겠습니까?');

          if (!isReal) {
            return;
          }

          try {
            const deleteApi = await fetch(`${API_URL}/posts/${id}`, {
              method: 'DELETE',
              headers: {
                Authorization: `Bearer ${token}`,
              },
            });

            if (!deleteApi.ok) {
              throw new Error('게시글 삭제에 실패했습니다.');
            }

            alert('게시글이 삭제되었습니다.');
            location.replace('./게시판목록.html');
          } catch (error) {
            console.error(error);
          }
        });
      }

      function correctionPost() {
        const correctionBtn = document.getElementById('correctionButton');
        if (!correctionBtn) {
          return;
        }

        correctionBtn.addEventListener('click', async () => {
          location.href = `./write.html?id=${id}`;
        });
      }
    </script>
  </body>
</html>
