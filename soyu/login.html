<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인</title>
    <style>
      body {
        font-family: 'Pretendard', sans-serif;
        background-color: #f5f6f8;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .login-container {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        width: 350px;
        text-align: center;
      }

      h2 {
        margin-bottom: 25px;
        color: #333;
      }

      input {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border: 1px solid #ddd;
        border-radius: 6px;
        box-sizing: border-box; 
      }

      button {
        width: 100%;
        padding: 12px;
        background-color: #222;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        transition: background 0.2s;
      }

      button:hover {
        background-color: #444;
      }

      .link-box {
        margin-top: 20px;
        font-size: 14px;
        color: #666;
      }

      .link-box a {
        color: #007bff;
        text-decoration: none;
      }

      #result {
        margin-top: 15px;
        font-size: 14px;
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h2>로그인</h2>

      <input type="text" id="username" placeholder="아이디" />
      <input type="password" id="password" placeholder="비밀번호" />
      <button id="loginBtn">로그인</button>

      <div id="result"></div>

      <div class="link-box">
        계정이 없으신가요? <a href="signupDG.html">회원가입</a>
      </div>
    </div>

    <script>
      document.getElementById("loginBtn").addEventListener("click", async () => {
        const result = document.getElementById("result");
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        if (!username || !password) {
          result.textContent = "아이디와 비밀번호를 입력해주세요.";
          result.style.color = "red";
          return;
        }

        const loginData = {
          username: username,
          password: password,
        };

        try {
          result.textContent = "로그인 중...";
          result.style.color = "#555";

          const res = await fetch(
            "https://api.fullstackfamily.com/api/edu/pride-d1c90b/auth/login",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(loginData),
            },
          );

          const data = await res.json();

          if (!res.ok) {

            throw new Error(data.message || "아이디 또는 비밀번호가 틀렸습니다.");
          }

    
          const token = data.data.accessToken || data.data.token;
          
          if (token) {
            localStorage.setItem("token", token);
            result.textContent = "로그인 성공! 이동중...";
            result.style.color = "green";

        
            setTimeout(() => {
              window.location.href = "태형님.html";
            }, 1000);
          } else {
            throw new Error("페이지를 찾을수없습니다");
          }

        } catch (error) {
          result.textContent = error.message;
          result.style.color = "red";
        }
      });


      document.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          document.getElementById('loginBtn').click();
        }
      });
    </script>
  </body>
</html>
