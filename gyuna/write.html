<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>글쓰기</title>
  </head>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Pretendard', sans-serif;
      background: linear-gradient(135deg, #ffffff, #ffffff);
    }

    .container {
      width: 520px;
      margin: 80px auto;
      background: white;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin: 0 0 25px;
      font-size: 26px;
      font-weight: 700;
      color: #111;
    }

    .user {
      font-size: 14px;
      color: #777;
      margin-bottom: 25px;
    }

    input,
    textarea {
      font-family: 'Pretendard', sans-serif;
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      background: #f0f0f0;
      transition: all 0.2s;
    }

    input:focus,
    textarea:focus {
      outline: none;
      background: #fff;
      box-shadow: 0 0 0 2px #151515;
    }

    textarea {
      height: 160px;
      resize: none;
      margin-top: 10px;
    }

    .writeBtn {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #414141, #2e2e2e);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .writeBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(100, 100, 100, 0.3);
    }

    .writeBtn:active {
      transform: scale(0.98);
    }
  </style>
  <body>
    <div class="container">
      <h2>게시글 작성</h2>

      <p class="user">닉네임: <span id="username"></span></p>

      <input id="title" placeholder="제목을 입력하세요." /><br /><br />
      <textarea id="content" placeholder="내용을 입력하세요."></textarea><br /><br />

      <button class="writeBtn" id="writeBtn">작성하기</button>

      <script>
        const token = localStorage.getItem('token');

        if (!token) {
          alert('로그인이 필요합니다.');
          window.location.href = 'login.html';
        } else {
          loadUserInfo();
        }

        async function loadUserInfo() {
          try {
            const res = await fetch('https://api.fullstackfamily.com/api/edu/pride-d1c90b/auth/me', {
              method: 'GET',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${token}`,
              },
            });

            const data = await res.json();
            console.log('내 정보:', data);

            if (!res.ok) {
              throw new Error('사용자 정보 조회 실패');
            }

            document.getElementById('username').textContent = data.data.nickname || '이름 없음';
          } catch (e) {
            console.error(e);
            document.getElementById('username').textContent = '이름 불러오기 실패';
          }
        }

        document.getElementById('writeBtn').addEventListener('click', async () => {
          const title = document.getElementById('title').value;
          const content = document.getElementById('content').value;

          try {
            // 1. draft 생성
            const draftRes = await fetch('https://api.fullstackfamily.com/api/edu/pride-d1c90b/posts', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({ title, content }),
            });

            const draftData = await draftRes.json();
            console.log('draft:', draftData);

            if (!draftRes.ok) {
              throw new Error('드래프트 생성 실패');
            }

            const postId = draftData.data.id;

            // 2. publish
            const publishRes = await fetch(`https://api.fullstackfamily.com/api/edu/pride-d1c90b/posts/${postId}/publish`, {
              method: 'PUT',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({ title, content }),
            });

            const publishData = await publishRes.json();
            console.log('publish:', publishData);

            if (!publishRes.ok) {
              throw new Error('발행 실패');
            }

            alert('게시글 작성 완료!');
            window.location.href = 'list.html';
          } catch (error) {
            console.error(error);
            alert('글 작성 실패');
          }
        });
      </script>
    </div>
  </body>
</html>
